---
- name: Déployer le DevSecOps Portfolio avec Docker Compose
  hosts: all
  become: true
  vars:
    repo_url: https://github.com/wissalelkouk/mini-cv.git
    repo_branch: main
    app_dir: /opt/mini-cv
    pg_password: "{{ lookup('ansible.builtin.password', '/tmp/portfolio_pg_password length=24 chars=ascii_letters,digits') }}"

  tasks:
    - name: Créer un swap de 2 Go (le build Next.js consomme de la mémoire)
      ansible.builtin.shell: |
        fallocate -l 2G /swapfile && chmod 600 /swapfile && mkswap /swapfile && swapon /swapfile
        echo '/swapfile none swap sw 0 0' >> /etc/fstab
      args:
        creates: /swapfile

    - name: Installer Docker, Compose et Git
      ansible.builtin.apt:
        name:
          - docker.io
          - docker-compose-v2
          - git
          - curl
        state: present
        update_cache: true
        cache_valid_time: 3600

    - name: Démarrer et activer Docker
      ansible.builtin.service:
        name: docker
        state: started
        enabled: true

    - name: Ajouter l'utilisateur vagrant au groupe docker
      ansible.builtin.user:
        name: vagrant
        groups: docker
        append: true

    - name: Récupérer le dépôt
      ansible.builtin.git:
        repo: "{{ repo_url }}"
        dest: "{{ app_dir }}"
        version: "{{ repo_branch }}"
        force: true

    - name: Générer le fichier .env (jamais commité)
      ansible.builtin.copy:
        dest: "{{ app_dir }}/.env"
        mode: "0600"
        content: |
          POSTGRES_USER=portfolio
          POSTGRES_PASSWORD={{ pg_password }}
          POSTGRES_DB=portfolio
          CORS_ORIGIN=http://192.168.56.10:3000
          RATE_LIMIT_MAX=5

    - name: Construire et lancer la pile Docker Compose
      ansible.builtin.command: docker compose up -d --build
      args:
        chdir: "{{ app_dir }}"
      register: compose
      retries: 3
      delay: 30
      until: compose.rc == 0
      changed_when: true

    - name: Attendre que le Portfolio réponde
      ansible.builtin.uri:
        url: http://localhost:3000
        status_code: 200
      register: portfolio
      until: portfolio.status == 200
      retries: 30
      delay: 10
