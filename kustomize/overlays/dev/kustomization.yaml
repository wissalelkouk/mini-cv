apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: portfolio
resources:
  - ../../base
replicas:
  - name: frontend
    count: 1
  - name: api
    count: 1
patches:
  - target:
      kind: ConfigMap
      name: portfolio-config
    patch: |-
      - op: replace
        path: /data/API_URL
        value: "http://api.portfolio.svc.cluster.local:4000"
