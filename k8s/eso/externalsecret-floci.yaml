apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: floci-demo
  namespace: portfolio
spec:
  refreshInterval: 30s
  secretStoreRef:
    name: floci-backend
    kind: SecretStore
  target:
    name: floci-demo-secret
    creationPolicy: Owner
  data:
    - secretKey: FLOCI_DEMO_KEY
      remoteRef:
        key: portfolio/floci-demo
        property: FLOCI_DEMO_KEY
