apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: api-demo
  namespace: portfolio
spec:
  refreshInterval: 30s
  secretStoreRef:
    name: vault-backend
    kind: SecretStore
  target:
    name: api-demo-secret
    creationPolicy: Owner
  data:
    - secretKey: API_DEMO_KEY
      remoteRef:
        key: portfolio/api
        property: API_DEMO_KEY
