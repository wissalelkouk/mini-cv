apiVersion: v1
kind: ServiceAccount
metadata:
  name: portfolio-sa
  namespace: portfolio
automountServiceAccountToken: false
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: portfolio-reader
  namespace: portfolio
rules:
  - apiGroups: [""]
    resources: ["configmaps"]
    resourceNames: ["portfolio-config"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: portfolio-reader-binding
  namespace: portfolio
subjects:
  - kind: ServiceAccount
    name: portfolio-sa
    namespace: portfolio
roleRef:
  kind: Role
  name: portfolio-reader
  apiGroup: rbac.authorization.k8s.io
