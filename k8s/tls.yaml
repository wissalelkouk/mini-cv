apiVersion: cert-manager.io/v1
kind: Issuer
metadata:
  name: selfsigned-issuer
  namespace: portfolio
spec:
  selfSigned: {}
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: portfolio-tls
  namespace: portfolio
spec:
  secretName: portfolio-tls
  duration: 2160h
  renewBefore: 360h
  dnsNames:
    - portfolio.local
  issuerRef:
    name: selfsigned-issuer
    kind: Issuer
