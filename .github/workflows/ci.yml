name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test-frontend:
    name: Tests frontend (Next.js)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: portfolio-next
    env:
      NEXT_PUBLIC_API_URL: http://localhost:3001
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: portfolio-next/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build

  test-api:
    name: Tests API (Express)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: api
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: api/package-lock.json
      - run: npm ci
      - run: npx prisma generate
      - run: npm test

  secrets-scan:
    name: Scan de secrets (Gitleaks)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - name: Gitleaks
        uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  sast-semgrep:
    name: SAST (Semgrep)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    container:
      image: semgrep/semgrep
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Semgrep scan
        run: |
          semgrep scan \
            --config=p/ci \
            --config=p/javascript \
            --config=p/typescript \
            --config=p/owasp-top-ten \
            --sarif-output=semgrep.sarif \
            --error
        env:
          SEMGREP_APP_TOKEN: ${{ secrets.SEMGREP_APP_TOKEN }}
      - name: Upload SARIF
        if: always()
        uses: github/codeql-action/upload-sarif@1fc58d04a4d4374f921bdac573c3811c240f9c26 # v4
        with:
          sarif_file: semgrep.sarif
          category: semgrep

  dependencies-audit:
    name: Audit dépendances (npm audit)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: portfolio-next
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: portfolio-next/package-lock.json
      - run: npm ci
      - name: npm audit (frontend)
        run: npm audit --audit-level=high
      - name: npm audit (API)
        working-directory: api
        run: |
          npm ci
          npm audit --audit-level=high
      - name: npm audit (release)
        working-directory: release
        run: |
          npm ci
          node ../.github/scripts/audit-release.js

  build-and-scan-images:
    name: Build and scan Docker images (Trivy)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - name: Build Frontend
        uses: docker/build-push-action@ca052bb54ab0790a636c9b5f226502c73d547a25 # v5
        with:
          context: ./portfolio-next
          push: false
          load: true
          tags: portfolio-frontend:latest
      - name: Build API
        uses: docker/build-push-action@ca052bb54ab0790a636c9b5f226502c73d547a25 # v5
        with:
          context: ./api
          push: false
          load: true
          tags: portfolio-api:latest
      - name: Trivy frontend (rapport lisible)
        run: |
          docker run --rm \
            -v /var/run/docker.sock:/var/run/docker.sock \
            -v trivy-cache:/root/.cache \
            ghcr.io/aquasecurity/trivy:0.69.3 image \
            --severity CRITICAL,HIGH --exit-code 0 \
            portfolio-frontend:latest
      - name: Trivy API (rapport lisible)
        run: |
          docker run --rm \
            -v /var/run/docker.sock:/var/run/docker.sock \
            -v trivy-cache:/root/.cache \
            ghcr.io/aquasecurity/trivy:0.69.3 image \
            --severity CRITICAL,HIGH --exit-code 0 \
            portfolio-api:latest
      - name: Trivy frontend (SARIF)
        run: |
          docker run --rm \
            -v /var/run/docker.sock:/var/run/docker.sock \
            -v trivy-cache:/root/.cache \
            -v "$PWD":/out \
            ghcr.io/aquasecurity/trivy:0.69.3 image \
            --severity CRITICAL,HIGH --exit-code 0 \
            --format sarif --output /out/trivy-frontend.sarif \
            portfolio-frontend:latest
      - name: Trivy API (SARIF)
        run: |
          docker run --rm \
            -v /var/run/docker.sock:/var/run/docker.sock \
            -v trivy-cache:/root/.cache \
            -v "$PWD":/out \
            ghcr.io/aquasecurity/trivy:0.69.3 image \
            --severity CRITICAL,HIGH --exit-code 0 \
            --format sarif --output /out/trivy-api.sarif \
            portfolio-api:latest
      - name: Upload SARIF frontend
        if: always() && hashFiles('trivy-frontend.sarif') != ''
        uses: github/codeql-action/upload-sarif@1fc58d04a4d4374f921bdac573c3811c240f9c26 # v4
        with:
          sarif_file: trivy-frontend.sarif
          category: trivy-frontend
      - name: Upload SARIF API
        if: always() && hashFiles('trivy-api.sarif') != ''
        uses: github/codeql-action/upload-sarif@1fc58d04a4d4374f921bdac573c3811c240f9c26 # v4
        with:
          sarif_file: trivy-api.sarif
          category: trivy-api
