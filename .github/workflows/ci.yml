name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test-frontend:
    name: Tests frontend (Next.js)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: portfolio-next
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: portfolio-next/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build
    test-api:
    name: Tests API (Express)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: api/package-lock.json
      - run: npm ci
      - run: npx prisma generate
      - run: npm test
