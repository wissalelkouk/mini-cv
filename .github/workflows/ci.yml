name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test-frontend:
    name: Tests frontend (Next.js)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: portfolio-next
    env:
      NEXT_PUBLIC_API_URL: http://localhost:3001
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: portfolio-next/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build

  test-api:
    name: Tests API (Express)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: api/package-lock.json
      - run: npm ci
      - run: npx prisma generate
      - run: npm test

  secrets-scan:
    name: Scan de secrets (Gitleaks)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  sast-semgrep:
    name: SAST (Semgrep)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    container:
      image: semgrep/semgrep
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v4
      - name: Semgrep scan
        run: |
          semgrep scan \
            --config=p/ci \
            --config=p/javascript \
            --config=p/typescript \
            --config=p/owasp-top-ten \
            --sarif --output=semgrep.sarif \
            --error
        env:
          SEMGREP_APP_TOKEN: ${{ secrets.SEMGREP_APP_TOKEN }}
      - name: Upload SARIF
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: semgrep.sarif
          category: semgrep

  dependencies-audit:
    name: Audit dépendances (npm audit)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: portfolio-next
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: portfolio-next/package-lock.json
      - run: npm ci
      - name: npm audit (frontend)
        run: npm audit --audit-level=high
        continue-on-error: true
      - name: npm audit (API)
        working-directory: api
        run: |
          npm ci
          npm audit --audit-level=high
        continue-on-error: true

  build-and-scan-images:
    name: Build and scan Docker images (Trivy)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Build Frontend
        uses: docker/build-push-action@v5
        with:
          context: ./portfolio-next
          push: false
          load: true
          tags: portfolio-frontend:latest
      - name: Build API
        uses: docker/build-push-action@v5
        with:
          context: ./api
          push: false
          load: true
          tags: portfolio-api:latest
      - name: Trivy frontend (rapport lisible)
        uses: aquasecurity/trivy-action@0.24.0
        with:
          image-ref: portfolio-frontend:latest
          format: table
          severity: CRITICAL,HIGH
          exit-code: '0'
      - name: Trivy API (rapport lisible)
        uses: aquasecurity/trivy-action@0.24.0
        with:
          image-ref: portfolio-api:latest
          format: table
          severity: CRITICAL,HIGH
          exit-code: '0'
      - name: Trivy frontend (SARIF)
        uses: aquasecurity/trivy-action@0.24.0
        with:
          image-ref: portfolio-frontend:latest
          format: sarif
          output: trivy-frontend.sarif
          severity: CRITICAL,HIGH
          exit-code: '0'
      - name: Trivy API (SARIF)
        uses: aquasecurity/trivy-action@0.24.0
        with:
          image-ref: portfolio-api:latest
          format: sarif
          output: trivy-api.sarif
          severity: CRITICAL,HIGH
          exit-code: '0'
      - name: Upload SARIF frontend
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: trivy-frontend.sarif
          category: trivy-frontend
      - name: Upload SARIF API
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: trivy-api.sarif
          category: trivy-api
