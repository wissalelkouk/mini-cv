name: Sign images

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish-and-sign:
    name: Publish, sign and attest images
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push API
        id: api
        uses: docker/build-push-action@ca052bb54ab0790a636c9b5f226502c73d547a25 # v5
        with:
          context: ./api
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/mini-cv-api:${{ github.sha }}
      - name: Build and push frontend
        id: frontend
        uses: docker/build-push-action@ca052bb54ab0790a636c9b5f226502c73d547a25 # v5
        with:
          context: ./portfolio-next
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/mini-cv-frontend:${{ github.sha }}
      - uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3
      - name: Sign images (keyless)
        env:
          OWNER: ${{ github.repository_owner }}
          API_DIGEST: ${{ steps.api.outputs.digest }}
          FRONT_DIGEST: ${{ steps.frontend.outputs.digest }}
        run: |
          cosign sign --yes "ghcr.io/$OWNER/mini-cv-api@$API_DIGEST"
          cosign sign --yes "ghcr.io/$OWNER/mini-cv-frontend@$FRONT_DIGEST"
      - name: Attest provenance (API)
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ghcr.io/${{ github.repository_owner }}/mini-cv-api
          subject-digest: ${{ steps.api.outputs.digest }}
          push-to-registry: true
      - name: Attest provenance (frontend)
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ghcr.io/${{ github.repository_owner }}/mini-cv-frontend
          subject-digest: ${{ steps.frontend.outputs.digest }}
          push-to-registry: true
      - name: Verify signatures
        env:
          OWNER: ${{ github.repository_owner }}
          REPO: ${{ github.repository }}
          API_DIGEST: ${{ steps.api.outputs.digest }}
          FRONT_DIGEST: ${{ steps.frontend.outputs.digest }}
        run: |
          for ref in "ghcr.io/$OWNER/mini-cv-api@$API_DIGEST" "ghcr.io/$OWNER/mini-cv-frontend@$FRONT_DIGEST"; do
            cosign verify \
              --certificate-identity-regexp "^https://github.com/$REPO/" \
              --certificate-oidc-issuer https://token.actions.githubusercontent.com \
              "$ref"
          done
